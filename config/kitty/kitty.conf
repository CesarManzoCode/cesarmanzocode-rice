# Kitty — functional defaults (shared). Colors from the active theme's
# colors.conf, included below.
include colors.conf

font_family      JetBrainsMono Nerd Font
font_size        11.0

window_padding_width 12
confirm_os_window_close 0

scrollback_lines 10000

# Translucent background so the wallpaper stays faintly visible behind the
# terminal, while glyphs/cursor/selection stay fully opaque (kitty only
# ever applies opacity to the cell background, never to rendered text).
# Hyprland's own compositor blur (see windows.lua) provides the blur-behind
# effect; kitty's own background_blur is left off on purpose — it only
# implements the KDE/wlr blur-behind-window protocol, which Hyprland does
# not expose, so enabling it here would do nothing but risk a second,
# redundant blur pass if a future Hyprland version does pick it up.
background_opacity 0.86
background_blur 0

# Minimal, monochrome tab bar — only visible once a second tab/window is
# open in the same OS window; colors come from the active theme below.
tab_bar_edge top
tab_bar_style slim
tab_bar_min_tabs 2

# Selecting text with the mouse also lands in the regular CLIPBOARD, so it
# pastes into other apps (e.g. Brave) with a plain Ctrl+V.
copy_on_select clipboard

# Keep the conventional terminal keybinds intact.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
# ctrl+c keeps its normal terminal meaning (SIGINT) — not remapped.

map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
