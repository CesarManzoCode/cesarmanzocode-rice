## monochrome — hyprlock (fully visual, no personal/functional prefs here)
## @WALLPAPER@ is substituted by apply.sh with the installed wallpaper path.

background {
    path = @WALLPAPER@
    blur_passes = 2
    blur_size = 4
    noise = 0.02
    contrast = 1.0
    brightness = 0.75
    color = rgba(05, 05, 05, 1.0)
}

general {
    hide_cursor = false
    grace = 2
    no_fade_in = false
}

label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 1.0)
    font_size = 88
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(154, 154, 154, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    size = 320, 56
    position = 0, -120
    halign = center
    valign = center
    dots_center = true
    outer_color = rgba(56, 56, 56, 1.0)
    inner_color = rgba(16, 16, 16, 0.9)
    font_color = rgba(244, 244, 244, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##9A9A9A">Password…</span>
    rounding = 12
    border_size = 1
    check_color = rgba(240, 240, 240, 1.0)
    fail_color = rgba(154, 154, 154, 1.0)
}
