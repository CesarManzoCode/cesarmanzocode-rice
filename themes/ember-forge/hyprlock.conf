## ember-forge — hyprlock (fully visual, no personal/functional prefs here)
## @WALLPAPER@ is substituted by apply.sh with the installed wallpaper path.

background {
    path = @WALLPAPER@
    blur_passes = 1
    blur_size = 3
    noise = 0.03
    contrast = 1.1
    brightness = 0.8
    color = rgba(12, 09, 07, 1.0)
}

general {
    hide_cursor = false
}
## grace/fade are launch-time behavior now, not visual config:
## general:grace was removed in favor of the `--grace 2` CLI flag
## (see config/hypridle/hypridle.conf.template's lock_cmd), and fade is
## on by default (no `--no-fade-in` passed).

label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 246, 236, 1.0)
    font_size = 88
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(156, 133, 112, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    size = 340, 58
    position = 0, -120
    halign = center
    valign = center
    dots_center = true
    outer_color = rgba(201, 117, 54, 1.0)
    inner_color = rgba(29, 22, 16, 0.95)
    font_color = rgba(234, 224, 213, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##9C8570">Password…</span>
    rounding = 6
    outline_thickness = 2
    check_color = rgba(232, 151, 59, 1.0)
    fail_color = rgba(181, 80, 43, 1.0)
}
