## arctic-glass — hyprlock (fully visual, no personal/functional prefs here)
## @WALLPAPER@ is substituted by apply.sh with the installed wallpaper path.
##
## Structure (see docs/themes/arctic-glass.md "Structure"): rather than
## monochrome's dead-centered clock/date/input stack, arctic-glass echoes
## the floating-glass language used everywhere else in this theme — the
## clock sits up and to the left of true center (an off-center anchor, more
## like a single card placed on a large quiet canvas), the date sits close
## beneath it as a caption, and the input field floats independently, lower
## and to the right, with real distance between the two groups instead of
## one stacked column. Same 3-block shape (background, 2 labels, 1
## input-field) and the @WALLPAPER@ placeholder as every other theme.

background {
    path = @WALLPAPER@
    blur_passes = 3
    blur_size = 7
    noise = 0.015
    contrast = 1.0
    brightness = 0.85
    color = rgba(10, 15, 22, 1.0)
}

general {
    hide_cursor = false
}
## grace/fade are launch-time behavior now, not visual config:
## general:grace was removed in favor of the `--grace 2` CLI flag
## (see config/hypridle/hypridle.conf.template's lock_cmd), and fade is
## on by default (no `--no-fade-in` passed).

label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = -260, 60
    halign = left
    valign = center
}

label {
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(140, 160, 175, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -262, -40
    halign = left
    valign = center
}

input-field {
    size = 320, 56
    position = 220, -160
    halign = right
    valign = center
    dots_center = true
    outer_color = rgba(42, 58, 70, 1.0)
    inner_color = rgba(18, 27, 37, 0.75)
    font_color = rgba(232, 240, 245, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##8CA0AF">Password…</span>
    rounding = 22
    outline_thickness = 1
    check_color = rgba(127, 216, 232, 1.0)
    fail_color = rgba(140, 160, 175, 1.0)
}
