## violet-night — hyprlock (fully visual, no personal/functional prefs here)
## @WALLPAPER@ is substituted by apply.sh with the installed wallpaper path.

background {
    path = @WALLPAPER@
    blur_passes = 3
    blur_size = 7
    noise = 0.035
    contrast = 1.05
    brightness = 0.7
    color = rgba(10, 8, 18, 1.0)
}

general {
    hide_cursor = false
}
## grace/fade are launch-time behavior now, not visual config:
## general:grace was removed in favor of the `--grace 2` CLI flag
## (see config/hypridle/hypridle.conf.template's lock_cmd), and fade is
## on by default (no `--no-fade-in` passed).

## Composition: off-center, left-anchored vertical stack in the lower-left
## third of the screen — deliberately NOT monochrome's dead-centered
## utilitarian block. This reads as more cinematic/"mood" (like a film's
## title card sitting in a quiet corner of the frame) while staying inside
## the wallpaper's existing centered quiet-zone box (the offset is modest,
## not pinned to a screen edge) and its type treatment differs too: an
## all-caps, letter-spaced date line under a lighter/less "clock app"
## time readout.

label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(246, 244, 255, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = -260, 60
    halign = left
    valign = center
}

## All-caps + explicit mid-dot separator for a title-card feel, distinct
## from monochrome's plain "Weekday, DD Month" sentence case.
label {
    text = cmd[update:60000] echo "$(date +'%A · %d %B' | tr '[:lower:]' '[:upper:]')"
    color = rgba(169, 112, 255, 1.0)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = -260, -20
    halign = left
    valign = center
}

input-field {
    size = 300, 54
    position = -260, -150
    halign = left
    valign = center
    dots_center = true
    outer_color = rgba(52, 43, 82, 1.0)
    inner_color = rgba(22, 18, 42, 0.85)
    font_color = rgba(231, 227, 246, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##8C84AD">Password…</span>
    rounding = 18
    outline_thickness = 2
    check_color = rgba(169, 112, 255, 1.0)
    fail_color = rgba(140, 132, 173, 1.0)
}
