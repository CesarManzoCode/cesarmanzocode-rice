## ivory-paper — hyprlock (fully visual, no personal/functional prefs here)
## @WALLPAPER@ is substituted by apply.sh with the installed wallpaper path.

background {
    path = @WALLPAPER@
    blur_passes = 1
    blur_size = 3
    noise = 0.01
    contrast = 1.0
    brightness = 1.0
    color = rgba(247, 244, 238, 1.0)
}

general {
    hide_cursor = false
}
## grace/fade are launch-time behavior now, not visual config:
## general:grace was removed in favor of the `--grace 2` CLI flag
## (see config/hypridle/hypridle.conf.template's lock_cmd), and fade is
## on by default (no `--no-fade-in` passed).

## Composition (v2 structural pass): quiet and architectural, not
## monochrome's centered-bold layout relabeled. Everything sits in a
## single left-aligned column roughly a fifth of the way across the
## screen, leaving the rest as deliberate open space — the same "large
## area + generous negative space" logic as the desktop composition,
## restated for the lock screen. Type is restrained (58 vs. monochrome's
## 88 for the clock) and the input field is a plain thin-outlined bar,
## not a bold centered pill.

label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(38, 35, 25, 1.0)
    font_size = 58
    font_family = JetBrainsMono Nerd Font
    position = 220, 24
    halign = left
    valign = center
}

label {
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(141, 133, 116, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 222, -28
    halign = left
    valign = center
}

input-field {
    size = 280, 44
    position = 220, -96
    halign = left
    valign = center
    dots_center = false
    outer_color = rgba(221, 214, 199, 1.0)
    inner_color = rgba(251, 249, 244, 0.95)
    font_color = rgba(38, 35, 25, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##8D8574">Password…</span>
    rounding = 2
    outline_thickness = 1
    check_color = rgba(43, 40, 32, 1.0)
    fail_color = rgba(141, 133, 116, 1.0)
}
